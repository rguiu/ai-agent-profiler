# Agent adapter registry for the benchmark runner.
#
# Each section defines how to invoke an agent in headless, auto-approving
# mode — required for non-interactive benchmark tasks.
#
# Fields:
#   binary  CLI executable (must be on PATH)
#   invoke  Arguments for headless mode
#   env     Environment variables set before launch (optional)

[opencode]
binary = "opencode"
invoke = "run --auto"
env = {}

[claude]
binary = "claude"
invoke = "-p --dangerously-skip-permissions"
env = {}

[stackpilot]
binary = "stackpilot"
invoke = "--yolo -p"
env = {}

[ollama]
binary = "claude"
invoke = "--model deepseek-v4-pro:0813 claude -p --dangerously-skip-permissions"
env = {}

# opencode launched via `aap run ollama opencode` (the real `ollama launch`
# adapter), so it talks to DeepSeek through the local daemon's cloud relay.
# `launcher = "ollama"` tells run.sh to pass "ollama" (not the key) to `aap run`.
[opencode-ollama]
binary = "opencode"
invoke = "--model deepseek-v4-pro:0813-cloud opencode run --auto"
launcher = "ollama"
env = {}
